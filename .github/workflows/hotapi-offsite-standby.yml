name: Offsite standby public snapshots
# GitHub cloud runner, not the household M4 or bt1. No Vercel deploy/Token.
on:
  schedule:
    - cron: '19 */2 * * *'
  workflow_dispatch:
  # Exercise actual GitHub-hosted network capture before this Draft is merged.
  # No Release writes, production deploys or extra credentials on PR events.
  pull_request:
    paths:
      - '.github/workflows/hotapi-offsite-standby.yml'
      - 'ops/capture-standby.mjs'
      - 'ops/compare-release-snapshot.mjs'
      - 'test/standby-release-admission.test.mjs'
      - 'lib/standby-core.js'
      - 'api/standby.js'
      - 'test/standby.test.mjs'

# A PR must never receive the Release token's write permission.
permissions:
  contents: read

jobs:
  verify-pr-cloud-capture:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate public capture contracts
        run: npm test
      - name: Cloud Runner capture dry run, never publish artifacts
        run: node ops/capture-standby.mjs --out-dir "$RUNNER_TEMP/hotapi-standby" --require-all

  refresh-public-snapshots:
    # GitHub schedule/dispatch are default-branch events. A PR can only read.
    if: >-
      github.repository == 'wuaishare/DailyHotApi-Vercel' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    concurrency:
      group: hotapi-standby-release-assets
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate public capture and fallback source contracts
        run: npm test
      - name: Capture verified live public rankings
        run: node ops/capture-standby.mjs --out-dir "$RUNNER_TEMP/hotapi-standby"
      - name: Publish valid Release assets, never a Vercel deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$RUNNER_TEMP"/hotapi-standby/*.json)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No verified snapshot; preserving last cloud release"
            exit 1
          fi
          tag=cloud-standby-v1
          previous_dir="$RUNNER_TEMP/hotapi-standby-last-good"
          mkdir -p "$previous_dir"
          if gh release view "$tag" >/dev/null 2>&1; then
            # Fail closed if prior known-good assets cannot be read. Do not blindly
            # overwrite a potentially newer snapshot with older cached data.
            gh release download "$tag" --pattern '*.json' --dir "$previous_dir" --clobber
          else
            gh release create "$tag" --target "$GITHUB_SHA" \
              --title "Public offsite standby snapshots" \
              --notes "Verified public ranking snapshots; not an independent live collector." \
              --latest=false
          fi
          updated=0
          kept=0
          for snapshot in "${files[@]}"; do
            asset="$(basename "$snapshot")"
            verdict="$(node ops/compare-release-snapshot.mjs "$snapshot" "$previous_dir/$asset")"
            if [[ "$verdict" == KEEP ]]; then
              echo "PRESERVED $asset (no newer upstream updateTime)"
              ((kept+=1))
              continue
            fi
            if [[ "$verdict" != PUBLISH ]]; then
              echo "::error::Snapshot admission refused for $asset"
              exit 1
            fi
            gh release upload "$tag" "$snapshot" --clobber
            echo "PUBLISHED $asset"
            ((updated+=1))
          done
          echo "Cloud assets updated=$updated preserved=$kept; no Vercel deployment." >> "$GITHUB_STEP_SUMMARY"
