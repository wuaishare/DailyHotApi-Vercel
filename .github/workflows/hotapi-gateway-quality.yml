name: HotAPI gateway quality
on:
  pull_request:
    branches: [master]
  push:
    branches: [master, feat/hotapi-vercel-gateway-20261028]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Assert fixed HTTPS upstream and no legacy runtime
        run: npm test
